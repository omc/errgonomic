name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        # Track the latest Ruby; setup-ruby resolves "3.4" to its newest patch
        # release. A support matrix down to a minimum Ruby can slot in here later.
        ruby:
          - "3.4"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run yard doctest
        run: bundle exec yard doctest
      - name: Run rake test
        run: bundle exec rake test
